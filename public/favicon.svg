<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Icon Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border glow -->
  <rect x="8" y="8" width="496" height="496" rx="107" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="8" />

  <!-- Tianzige subtle background grid inside icon -->
  <rect x="80" y="80" width="352" height="352" rx="32" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-dasharray="8 8" />
  <line x1="256" y1="80" x2="256" y2="432" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-dasharray="8 8" />
  <line x1="80" y1="256" x2="432" y2="256" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-dasharray="8 8" />

  <!-- Chinese Character 筆 (Bi / Pen / Stroke) -->
  <text x="50%" y="54%" 
        dominant-baseline="central" 
        text-anchor="middle" 
        font-family="'Noto Serif SC', 'Songti SC', 'SimSun', 'STSong', serif" 
        font-size="280" 
        font-weight="900" 
        fill="#ffffff" 
        filter="url(#shadow)">筆</text>
        
  <!-- Subtle gold dot accent for mastery -->
  <circle cx="395" cy="115" r="16" fill="#fbbf24" stroke="#f59e0b" stroke-width="3" />
</svg>
